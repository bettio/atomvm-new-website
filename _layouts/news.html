---
layout: default
---
<main class="page">
  {% if page.title %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  {% endif %}
  {{ content }}
  <div class="news-list">
    {% for post in site.posts %}
      {% include news_card.html post=post %}
    {% endfor %}
  </div>
</main>
